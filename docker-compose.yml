services:
  support:
    build: .
    ports:
      - "8050:8050"
    environment:
      DATABASE_URL: postgresql+asyncpg://diddi_support:diddi_support@postgres:5432/diddi_support
      REDIS_URL: redis://redis:6379/0
      REQUIRE_DEPENDENCIES: "true"
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-diddifree-id}
      SERVICE_AUDIENCE: ${SERVICE_AUDIENCE:-diddi-support}
      BACKOFFICE_AUDIENCE: diddi-comms-backoffice
      CONTEXT_CONNECTORS_JSON: ${CONTEXT_CONNECTORS_JSON:-{}}
      CONTEXT_REQUEST_TIMEOUT_SECONDS: ${CONTEXT_REQUEST_TIMEOUT_SECONDS:-3}
      CONTEXT_AUTH_TOKEN: ${CONTEXT_AUTH_TOKEN:-}
      CONTEXT_CLIENT_ID: ${CONTEXT_CLIENT_ID:-}
      DIDDIFREEID_SERVICE_TOKEN_URL: ${DIDDIFREEID_SERVICE_TOKEN_URL:-}
      DIDDISUPPORT_DIDDIGO_BASE_URL: ${DIDDISUPPORT_DIDDIGO_BASE_URL:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_ID: ${DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_ID:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_SECRET: ${DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_SECRET:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_AUDIENCE: ${DIDDISUPPORT_DIDDIGO_SERVICE_AUDIENCE:-diddigo}
      DIDDISUPPORT_DIDDIGO_SERVICE_SCOPE: ${DIDDISUPPORT_DIDDIGO_SERVICE_SCOPE:-diddigo:support-context:read}
      DIDDISUPPORT_DIDDISEND_BASE_URL: ${DIDDISUPPORT_DIDDISEND_BASE_URL:-}
      DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_ID: ${DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_ID:-}
      DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_SECRET: ${DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_SECRET:-}
      DIDDISUPPORT_DIDDISEND_SERVICE_AUDIENCE: ${DIDDISUPPORT_DIDDISEND_SERVICE_AUDIENCE:-diddisend}
      DIDDISUPPORT_DIDDISEND_SERVICE_SCOPE: ${DIDDISUPPORT_DIDDISEND_SERVICE_SCOPE:-diddisend:support-context:read}
      DIDDIFILES_BASE_URL: ${DIDDIFILES_BASE_URL:-}
      DIDDIFILES_AUTH_TOKEN: ${DIDDIFILES_AUTH_TOKEN:-}
      DIDDIFILES_CLIENT_ID: ${DIDDIFILES_CLIENT_ID:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      SOS_MAX_NOTIFICATION_ATTEMPTS: ${SOS_MAX_NOTIFICATION_ATTEMPTS:-3}
      SOS_ESCALATION_AFTER_SECONDS: ${SOS_ESCALATION_AFTER_SECONDS:-60}
    env_file:
      - path: .env
        required: false
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_support
      POSTGRES_USER: diddi_support
      POSTGRES_PASSWORD: diddi_support
    volumes:
      - support_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  support_postgres_data:
