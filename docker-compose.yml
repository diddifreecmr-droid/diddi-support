services:
  support-migrate:
    build: .
    command: ["python", "-m", "diddi_support.ops.migrate"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://diddi_support:diddi_support@postgres:5432/diddi_support}
      MIGRATIONS_PATH: ${MIGRATIONS_PATH:-/app/migrations}
      MIGRATION_MAX_ATTEMPTS: ${MIGRATION_MAX_ATTEMPTS:-30}
      MIGRATION_RETRY_SECONDS: ${MIGRATION_RETRY_SECONDS:-2}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy

  support:
    build: .
    ports:
      - "8050:8050"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8050/health/live', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://diddi_support:diddi_support@postgres:5432/diddi_support}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTBOX_STREAM_NAME: ${OUTBOX_STREAM_NAME:-diddisupport.events}
      OUTBOX_STREAM_MAXLEN: ${OUTBOX_STREAM_MAXLEN:-100000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-1}
      OUTBOX_BACKOFF_MAX_SECONDS: ${OUTBOX_BACKOFF_MAX_SECONDS:-300}
      REQUIRE_DEPENDENCIES: "true"
      IDENTITY_JWKS_URL: ${IDENTITY_JWKS_URL:-}
      IDENTITY_ISSUER: ${IDENTITY_ISSUER:-diddifree-id}
      SERVICE_AUDIENCE: ${SERVICE_AUDIENCE:-diddi-support}
      BACKOFFICE_AUDIENCE: diddi-comms-backoffice
      BACKOFFICE_SERVICE_CLIENT_IDS: ${BACKOFFICE_SERVICE_CLIENT_IDS:-}
      CONTEXT_CONNECTORS_JSON: ${CONTEXT_CONNECTORS_JSON:-{}}
      CONTEXT_REQUEST_TIMEOUT_SECONDS: ${CONTEXT_REQUEST_TIMEOUT_SECONDS:-3}
      CONTEXT_AUTH_TOKEN: ${CONTEXT_AUTH_TOKEN:-}
      CONTEXT_CLIENT_ID: ${CONTEXT_CLIENT_ID:-}
      CONTEXT_READER_ALLOWED_SERVICES: ${CONTEXT_READER_ALLOWED_SERVICES:-diddicomms,diddishop}
      CASE_DELEGATED_ORIGIN_SERVICES: ${CASE_DELEGATED_ORIGIN_SERVICES:-diddigo,diddifood,diddisend,diddipay,diddishop}
      DIDDICOMMS_SERVICE_CLIENT_ID: ${DIDDICOMMS_SERVICE_CLIENT_ID:-}
      DIDDIFREEID_SERVICE_TOKEN_URL: ${DIDDIFREEID_SERVICE_TOKEN_URL:-}
      DIDDISUPPORT_DIDDIGO_BASE_URL: ${DIDDISUPPORT_DIDDIGO_BASE_URL:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_ID: ${DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_ID:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_SECRET: ${DIDDISUPPORT_DIDDIGO_SERVICE_CLIENT_SECRET:-}
      DIDDISUPPORT_DIDDIGO_SERVICE_AUDIENCE: ${DIDDISUPPORT_DIDDIGO_SERVICE_AUDIENCE:-diddigo}
      DIDDISUPPORT_DIDDIGO_SERVICE_SCOPE: ${DIDDISUPPORT_DIDDIGO_SERVICE_SCOPE:-diddigo:support-context:read}
      DIDDISUPPORT_DIDDISEND_BASE_URL: ${DIDDISUPPORT_DIDDISEND_BASE_URL:-http://diddisend-api-staging.diddifree.com}
      DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_ID: ${DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_ID:-}
      DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_SECRET: ${DIDDISUPPORT_DIDDISEND_SERVICE_CLIENT_SECRET:-}
      DIDDISUPPORT_DIDDISEND_SERVICE_AUDIENCE: ${DIDDISUPPORT_DIDDISEND_SERVICE_AUDIENCE:-diddisend}
      DIDDISUPPORT_DIDDISEND_SERVICE_SCOPE: ${DIDDISUPPORT_DIDDISEND_SERVICE_SCOPE:-diddisend:support-context:read}
      DIDDISUPPORT_DIDDISHOP_BASE_URL: ${DIDDISUPPORT_DIDDISHOP_BASE_URL:-}
      DIDDISUPPORT_DIDDISHOP_SERVICE_CLIENT_ID: ${DIDDISUPPORT_DIDDISHOP_SERVICE_CLIENT_ID:-}
      DIDDISUPPORT_DIDDISHOP_SERVICE_CLIENT_SECRET: ${DIDDISUPPORT_DIDDISHOP_SERVICE_CLIENT_SECRET:-}
      DIDDISUPPORT_DIDDISHOP_SERVICE_AUDIENCE: ${DIDDISUPPORT_DIDDISHOP_SERVICE_AUDIENCE:-diddishop}
      DIDDISUPPORT_DIDDISHOP_SERVICE_SCOPE: ${DIDDISUPPORT_DIDDISHOP_SERVICE_SCOPE:-diddishop:support-context:read}
      DIDDIFILES_BASE_URL: ${DIDDIFILES_BASE_URL:-}
      DIDDIFILES_AUTH_TOKEN: ${DIDDIFILES_AUTH_TOKEN:-}
      DIDDIFILES_CLIENT_ID: ${DIDDIFILES_CLIENT_ID:-}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      SOS_MAX_NOTIFICATION_ATTEMPTS: ${SOS_MAX_NOTIFICATION_ATTEMPTS:-3}
      SOS_ESCALATION_AFTER_SECONDS: ${SOS_ESCALATION_AFTER_SECONDS:-60}
    env_file:
      - path: .env
        required: false
    depends_on:
      support-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  support-outbox-worker:
    build: .
    command: ["python", "-m", "diddi_support.ops.outbox_worker"]
    ports:
      - "9105:9105"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://diddi_support:diddi_support@postgres:5432/diddi_support}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OUTBOX_STREAM_NAME: ${OUTBOX_STREAM_NAME:-diddisupport.events}
      OUTBOX_STREAM_MAXLEN: ${OUTBOX_STREAM_MAXLEN:-100000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      OUTBOX_POLL_INTERVAL_SECONDS: ${OUTBOX_POLL_INTERVAL_SECONDS:-1}
      OUTBOX_LEASE_SECONDS: ${OUTBOX_LEASE_SECONDS:-60}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-12}
      OUTBOX_BACKOFF_BASE_SECONDS: ${OUTBOX_BACKOFF_BASE_SECONDS:-1}
      OUTBOX_BACKOFF_MAX_SECONDS: ${OUTBOX_BACKOFF_MAX_SECONDS:-300}
      OUTBOX_METRICS_PORT: ${OUTBOX_METRICS_PORT:-9105}
    env_file:
      - path: .env
        required: false
    depends_on:
      support-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: diddi_support
      POSTGRES_USER: diddi_support
      POSTGRES_PASSWORD: diddi_support
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diddi_support -d diddi_support"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - support_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    ports:
      - "${DIDDISUPPORT_REDIS_HOST_PORT:-16382}:6379"

volumes:
  support_postgres_data:
